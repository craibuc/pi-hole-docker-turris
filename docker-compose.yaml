# More info at https://github.com/pi-hole/docker-pi-hole/ and https://docs.pi-hole.net/
services:
  pihole:
    container_name: pihole
    image: pihole/pihole:latest
    # Resolver for the container's OWN lookups (blocklist downloads, updates).
    # Kept off the router so it can't loop through the port-53 DNAT rule.
    dns:
      - 9.9.9.9
    # Use the default docker0 bridge: the Turris firewall's `docker` zone only
    # covers docker0, so a compose-created bridge gets no outbound traffic.
    network_mode: bridge
    ports:
      # DNS: Map host 5354 to container 53
      - "5354:53/tcp"
      - "5354:53/udp"
      # Web Interface: Map host 8080 to container 80
      - "8080:80/tcp"
      # Web Interface SSL: Map host 8443 to container 443
      - "8443:443/tcp"
      # DNS Ports (used by kresd)
      # - "53:53/tcp"
      # - "53:53/udp"
      # 80 assigned to lighttpd (LuCI on OpenWrt uses 80 as well)
      # 443 assigned to lighttpd SSL (luCI on OpenWrt uses 443 as well)
      # Default HTTP Port
      # - "80:80/tcp"
      # Default HTTPs Port. FTL will generate a self-signed certificate
      # - "443:443/tcp"
      # Uncomment the line below if you are using Pi-hole as your DHCP server
      #- "67:67/udp"
      # Uncomment the line below if you are using Pi-hole as your NTP server
      #- "123:123/udp"
    environment:
      # Set the appropriate timezone for your location (https://en.wikipedia.org/wiki/List_of_tz_database_time_zones), e.g:
      TZ: 'America/Chicago'
      # Set a password to access the web interface. Not setting one will result in a random password being assigned
      FTLCONF_webserver_api_password: '${WEB_API_PASSWORD:?set WEB_API_PASSWORD in .env}'
      # If using Docker's default `bridge` network setting the dns listening mode should be set to 'ALL'
      FTLCONF_dns_listeningMode: 'ALL'
      # Forward to the Turris resolver (kresd) so DNSSEC validation and its cache still apply.
      # Use the docker0 gateway, not the LAN IP: kresd answers queries from the docker0
      # interface address, so a reply to 192.168.1.1 arrives from 172.17.0.1 and is dropped.
      FTLCONF_dns_upstreams: '${ROUTER_DOCKER_IP:-172.17.0.1}#53'
      # Required for the /etc/dnsmasq.d bind mount below to be read at all in v6
      FTLCONF_misc_etc_dnsmasq_d: 'true'
    # Bind mounts to the existing directories under /srv/docker/pihole on the router
    volumes:
      # Pi-hole's databases and common configuration file
      - '${PIHOLE_DATA_DIR:-/srv/docker/pihole}/etc-pihole:/etc/pihole'
      # Custom dnsmasq config. Pi-hole v6 IGNORES this mount unless
      # FTLCONF_misc_etc_dnsmasq_d is 'true' (set above).
      - '${PIHOLE_DATA_DIR:-/srv/docker/pihole}/etc-dnsmasq.d:/etc/dnsmasq.d'
    cap_add:
      # See https://github.com/pi-hole/docker-pi-hole#note-on-capabilities
      # Required if you are using Pi-hole as your DHCP server, else not needed
      - NET_ADMIN
      # Required if you are using Pi-hole as your NTP client to be able to set the host's system time
      - SYS_TIME
      # Optional, if Pi-hole should get some more processing time
      - SYS_NICE
    restart: unless-stopped